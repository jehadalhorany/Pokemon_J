<!doctype html><html lang="en" dir="ltr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon J</title><link rel="stylesheet" href="/style.css"><body><header><div><small>Adventure preview · 0.4</small><h1>Pokémon J</h1></div><div id="stats"></div></header><main><aside><h2>First Journey</h2><p>Meet the professor, choose your partner, and earn your first badge.</p><div id="mission"></div><button onclick="act({action:'refill'})">Restore 100 energy · 50 gems</button><h3>Your Team</h3><div id="team"></div></aside><section class="world"><div class="topline"><span id="location">Home</span><span>Arrow keys to walk · Enter to interact</span></div><canvas id="map" width="960" height="620"></canvas><div id="battle" hidden></div><div id="starter"><h2>Choose Your Partner</h2><p>You and your partner start at level 5.</p><div class="choices"><button onclick="start('bulbasaur')"><img data-starter="bulbasaur" alt="Bulbasaur">Bulbasaur<span>Grass / Poison</span></button><button onclick="start('charmander')"><img data-starter="charmander" alt="Charmander">Charmander<span>Fire</span></button><button onclick="start('squirtle')"><img data-starter="squirtle" alt="Squirtle">Squirtle<span>Water</span></button></div></div><div class="pad"><button data-direction="up">↑</button><button data-direction="right">→</button><button data-direction="down">↓</button><button data-direction="left">←</button><button onclick="encounter()">Interact</button></div></section><aside><h2>Storage & Cards</h2><div id="box"></div><h3>Pokédex</h3><input id="dex-search" type="search" placeholder="Search name, number or type" aria-label="Search Pokédex"><p id="dex-count"></p><div id="dex" class="dex-grid"></div><button id="dex-more" onclick="showMoreDex()">Show more</button></aside></main><div id="toast" role="status"></div><script src="/app.js"></script><script src="/scene.js"></script></body></html>
