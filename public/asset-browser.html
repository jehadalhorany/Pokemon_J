<!doctype html><html lang="en"><meta charset="utf-8"><title>Pokémon J model review</title><style>body{font:15px Arial;background:#1e3438;color:#edf0e5;margin:20px}input,select,button{padding:10px;margin:5px;background:#e5e8dd;border:0;border-radius:6px}main{display:grid;grid-template-columns:320px 1fr;gap:18px}#list{max-height:650px;overflow:auto}#list button{display:block;width:95%;text-align:left}iframe{width:100%;height:650px;border:0}small{display:block;font-size:11px}a{color:#dceac4}</style><h1>Model review</h1><a href="/">Back to game</a><p>Review imported models before placing them in a playable area.</p><input id="search" placeholder="Search model name"><select id="kind"><option value="">All models</option><option value="/Map/House/">Buildings</option><option value="/Map/Tree/">Trees</option><option value="/NPC/">NPCs</option><option value="/Player/">Player</option><option value="/Eudmon/">Pokémon</option></select><p id="count"></p><main><div id="list"></div><iframe id="preview" title="Model preview" src="/import-preview.html"></iframe></main><script type="module">const data=await fetch('/assets/imported/catalog.json').then(r=>r.json());const search=document.querySelector('#search'),kind=document.querySelector('#kind');function render(){const rows=data.models.filter(r=>r.name.toLowerCase().includes(search.value.toLowerCase())&&r.source.includes(kind.value));document.querySelector('#count').textContent=rows.length+' models · Showing first 100';const list=document.querySelector('#list');list.replaceChildren();for(const r of rows.slice(0,100)){const b=document.createElement('button');b.textContent=r.name;b.onclick=()=>document.querySelector('#preview').src='/import-preview.html?id='+r.id;list.append(b);}}search.oninput=kind.onchange=render;render();</script></html>
